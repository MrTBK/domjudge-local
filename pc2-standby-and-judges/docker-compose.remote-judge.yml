services:
  remote-judge-1:
    image: domjudge/judgehost:9.0.1-custom
    container_name: dj-remote-judge-1
    hostname: remote-judge-1
    restart: unless-stopped
    privileged: true
    cgroup: host
    environment:
      CONTAINER_TIMEZONE: ${CONTAINER_TIMEZONE:-Africa/Tunis}
      DOMSERVER_BASEURL: "http://${MAIN_SERVER_IP}:8080/"
      JUDGEDAEMON_USERNAME: judgehost
      JUDGEDAEMON_PASSWORD: ${JUDGEDAEMON_PASSWORD}
      DAEMON_ID: 0
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

